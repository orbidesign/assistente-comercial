<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Cidade Viva</title>
  <style>
    :root {
      --papel: #f6ecd2; --papel2: #eadbb6; --tinta: #3b2a1a; --tinta2: #7a6248; --borda: #b6935a;
      --estado: #3f6aa8; --negocio: #b5523b; --bom: #4f9a3c; --ruim: #b23a3a; --ouro: #d9a13a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1533; color: var(--tinta);
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 14px; }
    canvas#cena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .painel { position: fixed; background: linear-gradient(180deg, var(--papel), var(--papel2)); border: 2px solid var(--borda);
      border-radius: 10px; box-shadow: 0 3px 0 #8a6a3a, 0 8px 22px rgba(0, 0, 0, .35); }
    button { font: inherit; color: var(--tinta); cursor: pointer; background: #fff7e2; border: 1.5px solid var(--borda);
      border-radius: 7px; padding: 4px 9px; }
    button:hover { background: #fff; }
    button.ativo { background: var(--ouro); border-color: #8a6a3a; color: #fff; }

    #topo { top: 12px; left: 12px; padding: 10px 14px; width: 268px; }
    #topo h1 { margin: 0; font-size: 21px; letter-spacing: .3px; }
    #era { display: inline-block; margin-top: 3px; padding: 1px 9px; border-radius: 20px; background: var(--tinta); color: var(--papel); font-size: 12px; }
    #data { color: var(--tinta2); margin-left: 6px; font-style: italic; }
    #velocidade { display: flex; gap: 5px; margin-top: 9px; }
    #velocidade button { flex: 1; padding: 3px 0; }
    #grafico { width: 100%; height: 34px; margin-top: 8px; display: block; }
    #ia { margin-top: 6px; font-size: 12px; color: var(--tinta2); }
    #ia b { color: var(--bom); } #ia.off b { color: var(--tinta2); }

    #indicadores { top: 12px; left: 292px; right: 322px; padding: 7px 9px; display: flex; flex-wrap: wrap; gap: 5px 7px; align-items: center; }
    .chip { display: flex; align-items: baseline; gap: 4px; padding: 2px 8px; border-radius: 20px; background: rgba(255, 255, 255, .55); white-space: nowrap; }
    .chip small { color: var(--tinta2); font-size: 11px; }
    .chip b { font-size: 14px; }
    #tensao { flex: 1 1 210px; min-width: 190px; display: flex; align-items: center; gap: 6px; font-size: 12px; }
    #tensao .barra { flex: 1; height: 9px; border-radius: 9px; background: linear-gradient(90deg, var(--estado), #cfc4a8 50%, var(--negocio)); position: relative; }
    #tensao .marca { position: absolute; top: -4px; width: 5px; height: 17px; border-radius: 3px; background: var(--tinta); transform: translateX(-50%); transition: left .6s; }

    #cronica { top: 12px; right: 12px; width: 298px; max-height: 46vh; display: flex; flex-direction: column; }
    #cronica h2, #inspetor h2 { margin: 0; padding: 7px 12px; font-size: 15px; border-bottom: 1.5px solid var(--borda); }
    #log { overflow-y: auto; padding: 6px 10px 8px; }
    #log p { margin: 0 0 6px; padding-left: 8px; border-left: 3px solid #cbb78a; line-height: 1.3; }
    #log p small { color: var(--tinta2); display: block; font-size: 11px; }
    #log p.estado { border-color: var(--estado); } #log p.negocio { border-color: var(--negocio); }
    #log p.ruim { border-color: var(--ruim); } #log p.era { border-color: var(--ouro); font-weight: bold; }
    #log p.evento { border-color: #8a5fc9; background: rgba(138, 95, 201, .09); }

    #inspetor { right: 12px; bottom: 12px; width: 298px; display: none; }
    #inspetor .corpo { padding: 8px 12px 10px; line-height: 1.5; }
    #inspetor .corpo span { color: var(--tinta2); }
    #inspetor button { position: absolute; top: 5px; right: 6px; padding: 0 7px; }
    .medidor { height: 7px; border-radius: 7px; background: #d8c9a2; overflow: hidden; margin: 1px 0 5px; }
    .medidor i { display: block; height: 100%; background: var(--bom); }

    #narrador { left: 50%; bottom: 12px; transform: translateX(-50%); width: min(760px, calc(100vw - 660px)); min-width: 420px; padding: 8px 10px; }
    #narrador .titulo { font-size: 12px; color: var(--tinta2); margin-bottom: 5px; display: flex; justify-content: space-between; }
    #cartas { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
    .carta { flex: 0 0 auto; width: 84px; padding: 5px 4px; text-align: center; line-height: 1.15; font-size: 12px; border-radius: 8px;
      background: linear-gradient(180deg, #fffaf0, #f1e2bd); }
    .carta span { display: block; font-size: 22px; }
    .carta:hover { transform: translateY(-3px); }
    #narrar { display: flex; gap: 6px; margin-top: 2px; }
    #narrar input { flex: 1; font: inherit; padding: 6px 10px; border: 1.5px solid var(--borda); border-radius: 7px; background: #fffdf5; color: var(--tinta); min-width: 0; }
    #aviso { font-size: 12px; color: var(--tinta2); min-height: 16px; margin-top: 3px; }

    #acoes { left: 12px; bottom: 12px; padding: 7px 9px; display: flex; flex-direction: column; gap: 5px; width: 268px; }
    #acoes .linha { display: flex; gap: 5px; } #acoes .linha button { flex: 1; }
    #acoes small { color: var(--tinta2); line-height: 1.3; }

    #faixa { position: fixed; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .8s; }
    #faixa.visivel { opacity: 1; }
    #faixa div { display: inline-block; padding: 14px 46px; background: rgba(59, 42, 26, .86); color: #ffe9b0; border-top: 3px solid var(--ouro); border-bottom: 3px solid var(--ouro); }
    #faixa small { display: block; letter-spacing: 4px; font-size: 12px; text-transform: uppercase; opacity: .8; }
    #faixa b { font-size: 34px; letter-spacing: 1px; }

    @media (max-width: 1100px) {
      #indicadores { left: 12px; right: 12px; top: auto; bottom: 188px; font-size: 12px; }
      #cronica { max-height: 28vh; width: 250px; }
      #narrador { width: calc(100vw - 24px); min-width: 0; }
      #acoes { bottom: auto; top: 200px; width: 150px; } #acoes small { display: none; }
      #inspetor { bottom: 300px; }
    }
    @media (max-width: 640px) {
      #topo { width: 190px; padding: 7px 9px; } #topo h1 { font-size: 16px; } #grafico, #ia { display: none; }
      #cronica { width: calc(100vw - 226px); max-height: 150px; font-size: 12px; }
      #acoes { top: 150px; }
    }
  </style>
</head>
<body>
  <canvas id="cena"></canvas>

  <section id="topo" class="painel">
    <h1 id="nome">…</h1>
    <span id="era"></span><span id="data"></span>
    <div id="velocidade">
      <button data-v="0" title="Pausar (espaço)">⏸</button>
      <button data-v="1" title="1 mês a cada 4 segundos">▶</button>
      <button data-v="3">▶▶</button>
      <button data-v="12">▶▶▶</button>
    </div>
    <canvas id="grafico" title="População ao longo dos anos"></canvas>
    <div id="ia"></div>
  </section>

  <section id="indicadores" class="painel"></section>

  <section id="cronica" class="painel">
    <h2>Crônica da cidade</h2>
    <div id="log"></div>
  </section>

  <section id="inspetor" class="painel">
    <h2 id="insp-titulo"></h2>
    <button id="insp-fechar">×</button>
    <div class="corpo" id="insp-corpo"></div>
  </section>

  <section id="narrador" class="painel">
    <div class="titulo"><span>Você é o narrador. Jogue uma carta ou descreva o que acontece.</span></div>
    <div id="cartas"></div>
    <form id="narrar">
      <input id="texto" maxlength="600" autocomplete="off" placeholder="Ex.: um forasteiro rico chega querendo abrir um banco…" />
      <button type="submit">Narrar</button>
    </form>
    <div id="aviso"></div>
  </section>

  <section id="acoes" class="painel">
    <div class="linha">
      <button id="andar" title="Descer e andar pela cidade (V)">🚶 Andar</button>
      <button id="novo" title="Começar outra cidade">🌱 Novo vale</button>
    </div>
    <small>Arraste para girar · roda para zoom · botão direito move · clique em um prédio para ver quem mora lá · no modo andar, use WASD.</small>
  </section>

  <div id="faixa"><div><small>Nova era</small><b id="faixa-texto"></b></div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
